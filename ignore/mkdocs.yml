site_name: Documentation
site_description: A new project generated from the default template project.
site_author: Matt Piekenbrock
copyright: Copyright &copy; 2026 Matt Piekenbrock

nav:
  - $api/combin.***

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
    - toc.integrate

plugins:
  - search
  - mkapi:
      save: true